# SonarQube Cloud project configuration for Origin AI
# Project: originai.ca (Next.js 15 + TypeScript + React 19)

sonar.projectKey=mikebayes_originai
sonar.organization=mikebayes
sonar.host.url=https://sonarcloud.io

sonar.projectName=Origin AI Website
sonar.projectVersion=1.0

# ─── Sources ──────────────────────────────────────────────────────────
# Analyze the actual application code. Next.js app router lives in /app,
# shared React components in /components, helpers in /lib, and global
# CSS in /styles. Top-level config files (next.config.ts, app/sitemap.ts,
# etc.) are picked up via the default scan of the repo root.
sonar.sources=app,components,lib,styles

# ─── Exclusions ───────────────────────────────────────────────────────
# Skip vendored code, build output, static assets, design mockups, and
# documentation. Anything not authored by us, anything generated, and
# anything that is not application source code should be excluded so
# Sonar's metrics reflect real code health.
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  out/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  public/**,\
  assets/**,\
  docs/**,\
  claude_design_files/**,\
  mockup_*.html,\
  *.md,\
  next-env.d.ts,\
  **/*.min.js,\
  **/*.min.css

# Encoding for source files
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
